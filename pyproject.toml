
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generation and pathfinding library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
py-modules = ["mazegen"]
packages = [
    "entities",
    "generators",
    "pathfinding",
    "constants",
]